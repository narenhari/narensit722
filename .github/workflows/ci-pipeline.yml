name: CI & Staging Pipeline

on:
  push:
    branches:
      - testing

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.get_sha.outputs.sha_short }} 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short SHA for image tag
        id: get_sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/docker-login@v1
        with:
          #creds: ${{ secrets.AZURE_CREDENTIALS }}
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

      - name: Run unit tests
        run: |
          echo "Running tests"
          # IMPORTANT: Replace this with your project's actual test command.
          # For example, for a Node.js project:
          # npm install && npm test
          echo "Tests passed"

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        run: |
          docker build . -t ${{ secrets.ACR_LOGIN_SERVER }}/my-app:${{ steps.get_sha.outputs.sha_short }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/my-app:${{ steps.get_sha.outputs.sha_short }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-test-push 
    environment: Staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'

      - name: Tofu Init
        run: tofu init
        working-directory: ./infra

      - name: Tofu Apply
        run: |
          # Creates the infrastructure and deploys the container
          tofu apply -auto-approve \
            -var="resource_group_name=${{ secrets.RESOURCE_GROUP_NAME }}" \
            -var="docker_image=${{ secrets.ACR_LOGIN_SERVER }}/my-app:${{ needs.build-test-push.outputs.image_tag }}"
        working-directory: ./infra

  destroy-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging 
    if: always() 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'

      - name: Tofu Init
        run: tofu init
        working-directory: ./infra

      - name: Tofu Destroy
        run: |
          echo "Cleaning up staging resources"
          tofu destroy -auto-approve -var="resource_group_name=${{ secrets.RESOURCE_GROUP_NAME }}"
        working-directory: ./infra